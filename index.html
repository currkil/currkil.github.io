<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>currkill 的主页</title>
  <meta name="description" content="currkill 的个人主页：个人博客、Createure 期刊与我的项目。">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<!--
  =====================================================================
  ★ 备忘
  =====================================================================
  · GitHub 用户名现在填的是 currkil；以后找回 currkill 账号后，
    把「找到我」里的 https://github.com/currkil 改成 currkill 即可。
  · 首页那句话介绍在下面 .hero__tagline 处。
  · 想再加联系方式（邮箱、Steam…）：复制「找到我」里任意一个
    <li>…</li> 整块，改 图标 / 名称 / 链接 三处。图标用行内 SVG，
    不依赖任何外部资源。
  · 背景图不是改这里，改 style.css 顶部的 --bg-image。

  注：本项目是个人主页，与子项目 Createure 期刊各自独立，
      改 Createure 不会影响本页。
  =====================================================================
-->

<main class="page">

  <header class="hero">
    <h1 class="hero__name">currkill</h1>
    <!-- TODO: 换成你自己的一句话介绍 -->
    <p class="hero__tagline">开机不关机，关机不开机？名称：开机不开机,currkil,currkill</p>
  </header>

  <!-- ================= 三个入口按钮 ================= -->
  <nav class="entries" aria-label="主要入口">

    <a class="entry" href="./blogs/index.html">
      <span class="entry__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H14l6 6v8.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5z"/>
          <path d="M14 4v6h6"/>
        </svg>
      </span>
      <span class="entry__text">
        <span class="entry__title">个人博客</span>
        <span class="entry__desc">随笔、笔记与折腾记录</span>
      </span>
    </a>

    <a class="entry" href="./createure/index.html">
      <span class="entry__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H18a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5.5A1.5 1.5 0 0 1 4 19.5z"/>
          <path d="M8.5 3v18"/>
        </svg>
      </span>
      <span class="entry__text">
        <span class="entry__title">Createure 期刊</span>
        <span class="entry__desc">机械动力的学术整活期刊</span>
      </span>
    </a>

    <a class="entry" href="./projects/index.html">
      <span class="entry__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/>
          <rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/>
          <rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/>
          <rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/>
        </svg>
      </span>
      <span class="entry__text">
        <span class="entry__title">我的项目</span>
        <span class="entry__desc">做过的各种东西</span>
      </span>
    </a>

  </nav>

  <!-- ================= 联系方式 =================
       想再加一个联系方式？复制下面任意一个 <li>…</li> 整块，
       粘到列表里，然后改 图标 / 名称 / 链接 三处即可。
       图标用行内 SVG，不依赖任何外部资源。
       ============================================ -->
  <section class="contacts" aria-labelledby="contacts-title">
    <h2 class="contacts__title" id="contacts-title">找到我</h2>

    <ul class="contacts__list">
      <li>
        <a class="contact" href="https://space.bilibili.com/1347301776"
           target="_blank" rel="noopener noreferrer">
          <span class="contact__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 3.5 9.5 6"/>
              <path d="M17 3.5 14.5 6"/>
              <rect x="3" y="6" width="18" height="13" rx="2.5"/>
              <path d="M9.5 11v1.5"/>
              <path d="M14.5 11v1.5"/>
            </svg>
          </span>
          <span class="contact__label">Bilibili</span>
          <span class="contact__value">currkill</span>
        </a>
      </li>

      <!-- GitHub：已填好，改名后记得同步这一处 -->
      <li>
        <a class="contact" href="https://github.com/currkil"
           target="_blank" rel="noopener noreferrer">
          <span class="contact__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55
                       0-.27-.01-1.17-.02-2.12-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68
                       -1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.76 2.69 1.25 3.34.96
                       .1-.74.4-1.25.72-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.28 1.18-3.09
                       -.12-.29-.51-1.46.11-3.05 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0
                       c2.18-1.49 3.14-1.18 3.14-1.18.63 1.59.24 2.76.12 3.05.74.81 1.18 1.83 1.18 3.09
                       0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.06.78 2.14 0 1.55-.02 2.79-.02 3.17
                       0 .31.21.67.8.55A11.5 11.5 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5z"/>
            </svg>
          </span>
          <span class="contact__label">GitHub</span>
          <span class="contact__value">currkil</span>
        </a>
      </li>

    </ul>
  </section>

</main>

<footer class="footer">
  <p>© currkill</p>
</footer>

</body>
</html>
