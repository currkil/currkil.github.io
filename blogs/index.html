<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个人博客 · currkill</title>
  <meta name="description" content="currkill 的个人博客：折腾记录、笔记与随笔。">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<!--
  =====================================================================
  ★ 怎么加一篇新文章（三步）
  =====================================================================
  1. 复制 blogs/posts/hello/ 整个文件夹，粘到 blogs/posts/ 下面，
     改名成你想要的网址，例如 my-first-post（英文小写 + 连字符）。

  2. 打开新文件夹里的 index.html，改这几处：
        <title>             浏览器标签上的标题
        <meta name="description">  搜索/分享时显示的摘要
        .article__title     文章大标题
        <time datetime="…"> 日期，datetime 用 2026-10-01 这种格式
        .article__body      正文，想写多少段写多少段

  3. 回到本文件，复制下面任意一整条 <a class="post"> … </a>，
     粘到列表最上面（新文章放最上面），改这四处：
        href              → ./posts/你的文件夹名/index.html
        .post__title      → 文章标题
        .post__excerpt    → 一句话摘要（太长会自动省略号）
        <time>            → 日期

  想删掉一篇文章，就把列表里那一条 <a>…</a> 删掉，
  再删掉 blogs/posts/ 下对应的文件夹。
  =====================================================================
-->

<main class="page">

  <nav class="crumbs">
    <a href="../index.html">← 返回主页</a>
  </nav>

  <header class="hero hero--sub">
    <h1 class="hero__name">个人博客</h1>
    <p class="hero__tagline">折腾记录、笔记与随笔。</p>
  </header>

  <!-- ================= 文章列表 =================
       新的排在最上面。每条就是一篇，点击进入正文。
       ============================================ -->
  <div class="posts">

    <a class="post" href="./posts/hello/index.html">
      <div class="post__main">
        <div class="post__title">博客开张了</div>
        <div class="post__excerpt">这个博客是干什么的，以及以后会放些什么。</div>
      </div>
      <div class="post__aside">
        <span class="post__date"><time datetime="2026-10-01">2026-10-01</time></span>
        <span class="post__arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 6l6 6-6 6"/>
          </svg>
        </span>
      </div>
    </a>

    <a class="post" href="./posts/how-to-add-post/index.html">
      <div class="post__main">
        <div class="post__title">这个博客是怎么搭起来的</div>
        <div class="post__excerpt">纯静态、无框架、无构建步骤，以及怎么往里加一篇新文章。</div>
      </div>
      <div class="post__aside">
        <span class="post__date"><time datetime="2026-10-01">2026-10-01</time></span>
        <span class="post__arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 6l6 6-6 6"/>
          </svg>
        </span>
      </div>
    </a>

  </div>

</main>

<footer class="footer">
  <p>© currkill</p>
</footer>

</body>
</html>
